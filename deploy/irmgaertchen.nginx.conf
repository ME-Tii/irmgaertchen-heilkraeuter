# nginx-Site für den Irmgärtchen-Shop
# Nach /etc/nginx/sites-available/irmgaertchen kopieren und verlinken:
#   sudo cp deploy/irmgaertchen.nginx.conf /etc/nginx/sites-available/irmgaertchen
#   sudo ln -s /etc/nginx/sites-available/irmgaertchen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domain anpassen und HTTPS (certbot) einrichten:
#   sudo certbot --nginx -d irmgaertchen.example.de

server {
    listen 80;
    server_name irmgaertchen.example.de;

    # max. Requestgröße für Formulare/Nachrichten/Bilduploads
    client_max_body_size 6m;

    # statische Dateien direkt ausliefern (HTML, JS, CSS, Bilder)
    location /assets/ {
        root /home/thomasseitz22/irmgaertchen-shop;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Backend + Rest des Shops über gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
